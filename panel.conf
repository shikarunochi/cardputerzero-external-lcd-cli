# Ported from the supplied st7789_test.py.
spi /dev/spidev0.1
gpiochip /dev/gpiochip0
dc 22
rst 26
# 32 MHz confirmed by the user after testing the Python version.
speed_hz 32000000
mode 0
offset 0 0
ext5v auto
ext5v_delay_ms 150

rst_level 1
delay_ms 50
rst_level 0
delay_ms 50
rst_level 1
delay_ms 150
cmd 01        # SWRESET
delay_ms 150
cmd 11        # SLPOUT
delay_ms 120
cmd 3A 55     # RGB565
cmd 36 60     # MADCTL: landscape, RGB
cmd 20        # INVOFF
cmd 13        # NORON
cmd 29        # DISPON
delay_ms 100
